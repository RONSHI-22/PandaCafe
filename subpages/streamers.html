<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STREAMERS</title>

    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
    <link rel="stylesheet" href="../styles/Streamer.css">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Dancing+Script&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="../Pictures/panada.png">
</head>
<body>
    <header>
    <h1>Panda Cafe</h1>
</header>

<section class="streamer-card">

    <div class="left-side">
        <img src="../Pictures/redss.jpg" alt="Streamer">

        <h2 class="streamer-name">RED PANDA</h2>
    </div>

    <div class="right-side">

        <div class="top-info">
            <h2>Company Name: <span>Panda Cafe</span></h2>

            <div class="role">
                Streamer/Server Owner
            </div>
        </div>

        <div class="info-boxes">

            <div class="box">
                <h3>🎮 Gaming</h3>
                <p>
                    Loves MMORPGs and FPS games.
                    Streams daily with viewers.
                </p>
            </div>

            <div class="box">
                <h3>💻 Professional</h3>
                <p>
                    Panda Cafe content creator and
                    community moderator.
                </p>
            </div>

            <div class="box">
                <h3>⭐ Other</h3>
                <p>
                    Friendly, entertaining and enjoys
                    interacting with fans.
                </p>
            </div>

        </div>

    </div>

</section>
</body>
</html>
