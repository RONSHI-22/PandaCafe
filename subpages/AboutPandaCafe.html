<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
    <title>ABOUT PANDA CAFE</title>
    <link rel="stylesheet" href="../styles/ABC.css">
    <link rel="icon" type="image/png" href="../Pictures/panada.png">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;500;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
</head>
<body>
    <script src="../JSfiles/function.js"></script>
    <header>
        <h1 id="lo">Panda Cafe</h1>
    </header>

<main>

    <div class="top">
        <h1>What is PandaCafe?</h1>
        <p>
            PandaCafe is a community server where players can meet friends,
            enjoy fun events, and have an amazing gaming experience.
        </p>
    </div>

    <!-- LEFT -->

    <div class="leftInfoBox">

        <div class="infoBox" data-title="Friendly Community"
        data-info="Meet friendly players and enjoy a welcoming environment.">
            <h2>Community</h2>
        </div>

        <div class="infoBox" data-title="Amazing Events"
        data-info="Participate in weekly events and win awesome prizes.">
            <h2>Events</h2>
        </div>

        <div class="infoBox" data-title="Rewards"
        data-info="Earn coins, ranks and exclusive rewards while playing.">
            <h2>Rewards</h2>
        </div>

    </div>

    <!-- CENTER -->

    <div class="pandaAnimation"></div>

    <!-- RIGHT -->

    <div class="rightInfoBox">

        <div class="infoBox"
        data-title="Custom Features"
        data-info="Enjoy custom plugins and unique gameplay.">

            <h2>Features</h2>

        </div>

        <div class="infoBox"
        data-title="Friendly Staff"
        data-info="Our staff team is always ready to help players.">

            <h2>Support</h2>

        </div>

        <div class="infoBox"
        data-title="Join Us"
        data-info="Become part of PandaCafe today and start your adventure.">

            <h2>Join</h2>

        </div>

    </div>

</main>

<!-- POPUP -->

<div id="popup" class="popup">

    <div class="popupContent">

        <span id="closePopup">&times;</span>

        <h2 id="popupTitle"></h2>

        <p id="popupText"></p>

    </div>

</div>

</body>
</html>
